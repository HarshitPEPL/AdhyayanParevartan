<div class="screen courses-screen has-bottom-nav">

    <div class="library-header">
        <div class="library-header-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="library-header-titles">
            <h2>My Library</h2>
            <div class="courses-class-label" id="courses-class-label">Loading your class...</div>
        </div>
        <button type="button" class="library-header-filter-btn" id="courses-filter-icon" title="Filter">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </div>

    <!-- Subject filter (dynamic) -->
    <div class="subject-filter-row" id="subject-filter-slider">
        <!-- Populated by courses.js -->
        <div class="subject-pill active" data-subject="All">All Subjects</div>
    </div>

    <div class="library-search-row">
        <div class="library-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="courses-search-input" placeholder="Search courses..." aria-label="Search courses">
        </div>
        <button type="button" class="library-search-filter-btn" id="courses-search-filter-icon" title="Filter">
            <i class="fa-solid fa-filter"></i>
        </button>
    </div>

    <!-- Active content-type filter chip (set via the filter button) -->
    <div class="active-filters-row hidden" id="active-filters-row"></div>

    <div class="curriculum-list" id="student-materials-list">
        <div class="loading-state">
            <div class="loader-ring"></div>
            <p>Loading your library...</p>
        </div>
    </div>

    <!-- Filter modal sheet (triggered by the sliders icon) -->
    <div class="modal-overlay hidden" id="courses-filter-overlay"></div>
    <div class="modal-sheet hidden" id="courses-filter-sheet">
        <div class="modal-header" style="text-align:center;">
            <div class="close-btn" id="courses-filter-close"><i class="fa-solid fa-xmark"></i></div>
            <h2>Filter Library</h2>
            <p>Choose a subject and chapter to narrow down your materials</p>
        </div>

        <div class="filter-group">
            <label class="filter-group-label">Subject</label>
            <div class="subject-filter-row" id="filter-modal-subjects">
                <!-- Populated by courses.js -->
            </div>
        </div>

        <div class="filter-group">
            <label class="filter-group-label">Chapter</label>
            <div class="category-slider" id="filter-modal-chapters">
                <!-- Populated by courses.js based on the selected subject -->
                <div class="category-pill active" data-chapter="All">All Chapters</div>
            </div>
        </div>

        <button class="btn btn-primary" id="courses-filter-apply">Apply Filters</button>
        <button class="btn btn-outline" id="courses-filter-reset">Reset</button>
    </div>

</div>
