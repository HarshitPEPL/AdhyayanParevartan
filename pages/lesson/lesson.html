<div class="screen lesson-screen">
    <div class="lesson-reader-shell">
        <div class="lesson-reader-header">
            <div class="lesson-brand">Adhyayan</div>
            <div class="lesson-reader-meta">Page 1</div>
        </div>
        <div class="media-player" id="lesson-viewer-container">
            <!-- Dynamically populated via lesson.js -->
        </div>
        <div class="lesson-reader-footer">
            <i class="fa-solid fa-book-open-reader"></i>
            <span>Fullscreen Read</span>
        </div>
    </div>

    <div class="metadata-registry">
        <div class="breadcrumb" id="lesson-subject">SUBJECT - CLASS</div>
        <h2 id="lesson-title">Material Title</h2>

        <div class="data-table" style="margin-top: 16px;">
            <div class="col">
                <div class="label">Format</div>
                <div class="val" id="lesson-format">Format</div>
            </div>
            <div class="col">
                <div class="label">Duration</div>
                <div class="val" id="lesson-duration">--</div>
            </div>
            <div class="col">
                <div class="label">Author/Instructor</div>
                <div class="val green-text" id="lesson-instructor">Name</div>
            </div>
        </div>
    </div>

    <div class="asset-management" style="padding: 20px;">
        <div class="download-row" id="lesson-download-btn">
            <i class="fa-solid fa-cloud-arrow-down" id="lesson-download-icon"></i>
            <span id="lesson-download-text">Download Material</span>
        </div>
    </div>

    <div class="sticky-action">
        <button class="btn btn-primary lesson-back-btn">Back to Library</button>
    </div>
</div>
