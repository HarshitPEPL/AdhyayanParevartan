<div class="screen lesson-screen">
    <!-- Fullscreen Exit Button (hidden by default, shown in fullscreen mode) -->
    <button id="lesson-fullscreen-exit-btn" class="fullscreen-exit-btn" type="button" aria-label="Exit fullscreen" style="display: none;">
        <i class="fa-solid fa-compress"></i>
    </button>

    <div class="reader-app">
        <header class="reader-topbar">
            <div class="reader-topbar-brand">
                <span class="reader-logo-badge"><i class="fa-solid fa-graduation-cap"></i></span>
                <span class="reader-logo-text">Adhyayan</span>
            </div>
            <div class="reader-topbar-titles">
                <span class="reader-topbar-title" id="lesson-title-inline">Material Title</span>
                <span class="reader-topbar-divider">|</span>
                <span class="reader-topbar-sub" id="lesson-subject-inline">Class - Subject</span>
            </div>
            <div class="reader-topbar-controls">
                <span class="reader-page-badge" id="reader-page-badge" style="display:none;">Page 1</span>
                <div class="reader-zoom-group" style="display:none;">
                    <button type="button" class="reader-zoom-out" aria-label="Zoom out"><i class="fa-solid fa-minus"></i></button>
                    <span class="reader-zoom-level">100%</span>
                    <button type="button" class="reader-zoom-in" aria-label="Zoom in"><i class="fa-solid fa-plus"></i></button>
                </div>
                <button type="button" class="reader-icon-btn reader-icon-fit" style="display:none;" aria-label="Reset zoom"><i class="fa-solid fa-table-cells"></i></button>
                <button type="button" class="reader-icon-btn reader-icon-fullscreen" id="lesson-fullscreen-toggle" aria-label="Toggle fullscreen"><i class="fa-solid fa-expand"></i></button>
                <div class="reader-settings-wrap">
                    <button type="button" class="reader-icon-btn reader-icon-settings" aria-label="More options"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </header>

        <div class="reader-body">
            <div class="reader-main">
                <div class="reader-viewer-card">
                    <button id="lesson-back-overlay-btn" class="reader-back-pill" type="button" aria-label="Back to library">
                        <i class="fa-solid fa-arrow-left"></i><span>Back to Library</span>
                    </button>

                    <div class="media-player" id="lesson-viewer-container">
                        <!-- Dynamically populated via lesson.js -->
                    </div>

                    <div class="reader-bottombar" id="reader-bottombar" style="display:none;">
                        <button type="button" id="pdf-prev-page" class="reader-nav-btn"><i class="fa-solid fa-chevron-left"></i><span>Previous</span></button>
                        <div class="reader-page-select-wrap">
                            <select id="pdf-page-select" aria-label="Jump to page"></select>
                        </div>
                        <button type="button" id="pdf-next-page" class="reader-nav-btn"><span>Next</span><i class="fa-solid fa-chevron-right"></i></button>
                        <div class="reader-zoom-group">
                            <button type="button" class="reader-zoom-out" aria-label="Zoom out"><i class="fa-solid fa-minus"></i></button>
                            <span class="reader-zoom-level">100%</span>
                            <button type="button" class="reader-zoom-in" aria-label="Zoom in"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        <button type="button" class="reader-icon-btn reader-icon-fit" aria-label="Reset zoom"><i class="fa-solid fa-table-cells"></i></button>
                        <button type="button" class="reader-icon-btn reader-icon-fullscreen" aria-label="Toggle fullscreen"><i class="fa-solid fa-expand"></i></button>
                        <div class="reader-settings-wrap">
                            <button type="button" class="reader-icon-btn reader-icon-settings" aria-label="More options"><i class="fa-solid fa-gear"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="reader-sidebar">
                <div class="reader-sidebar-book">
                    <span class="reader-book-icon"><i class="fa-solid fa-book-open"></i></span>
                    <span class="reader-book-title" id="lesson-title">Material Title</span>
                </div>
                <div class="reader-meta-list">
                    <div class="reader-meta-row reader-meta-row-title">
                        <i class="fa-regular fa-file-lines"></i>
                        <div>
                            <div class="reader-meta-label">Title</div>
                            <div class="reader-meta-value" id="lesson-meta-title">-</div>
                        </div>
                    </div>
                    <div class="reader-meta-row">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <div>
                            <div class="reader-meta-label">Class</div>
                            <div class="reader-meta-value" id="lesson-meta-class">-</div>
                        </div>
                    </div>
                    <div class="reader-meta-row">
                        <i class="fa-solid fa-book"></i>
                        <div>
                            <div class="reader-meta-label">Subject</div>
                            <div class="reader-meta-value" id="lesson-meta-subject">-</div>
                        </div>
                    </div>
                    <div class="reader-meta-row">
                        <i class="fa-regular fa-file"></i>
                        <div>
                            <div class="reader-meta-label">Format</div>
                            <div class="reader-meta-value" id="lesson-format">Format</div>
                        </div>
                    </div>
                    <div class="reader-meta-row">
                        <i class="fa-regular fa-user"></i>
                        <div>
                            <div class="reader-meta-label">Instructor</div>
                            <div class="reader-meta-value green-text" id="lesson-instructor">Name</div>
                        </div>
                    </div>
                    <div class="reader-meta-row">
                        <i class="fa-regular fa-clock"></i>
                        <div>
                            <div class="reader-meta-label">Duration</div>
                            <div class="reader-meta-value" id="lesson-duration">--</div>
                        </div>
                    </div>
                    <div class="reader-meta-row reader-meta-row-chapter">
                        <i class="fa-solid fa-bookmark"></i>
                        <div>
                            <div class="reader-meta-label">Chapter</div>
                            <div class="reader-meta-value" id="lesson-chapter">-</div>
                        </div>
                    </div>
                </div>
                <div class="reader-sidebar-actions">
                    <button type="button" class="reader-download-btn" id="lesson-download-btn">
                        <i class="fa-solid fa-cloud-arrow-down" id="lesson-download-icon"></i>
                        <span id="lesson-download-text">Download Material</span>
                    </button>
                </div>
            </aside>
        </div>
    </div>
</div>
