<div class="screen progress-screen has-bottom-nav">
    <div class="progress-page-header">
        <h2>Your Progress</h2>
        <div class="progress-class-tag" id="progress-class-tag">Class —</div>
    </div>

    <div class="stats-dashboard">
        <div class="stat-frame">
            <div class="stat-val" id="stat-lessons">0</div>
            <div class="stat-label">LESSONS</div>
        </div>
        <div class="stat-frame">
            <div class="stat-val" id="stat-quizzes">0</div>
            <div class="stat-label">QUIZZES</div>
        </div>
        <div class="stat-frame">
            <div class="stat-val" id="stat-score">—</div>
            <div class="stat-label">AVG SCORE</div>
        </div>
    </div>

    <div class="evaluation-pipeline">
        <div class="divider-title">Subject Progress</div>
        <div class="progress-trace-list" id="dynamic-subject-progress">
            <!-- Populated by progress.js -->
            <div class="loading-state" style="padding:30px;text-align:center;color:#bbb;">
                <div class="loader-ring" style="margin:0 auto 12px;"></div>
                Loading subjects...
            </div>
        </div>
    </div>

    <div class="audit-journal">
        <div class="divider-title">Recent Activity</div>
        <div class="audit-log-block">
            <div class="token-canvas"><i class="fa-solid fa-book-open"></i></div>
            <div class="log-content">
                <h4>Start your first lesson!</h4>
                <p>Go to My Library to begin.</p>
            </div>
        </div>
    </div>
</div>
