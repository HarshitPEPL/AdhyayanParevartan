<div class="screen home-screen has-bottom-nav">

    <div class="profile-row">
        <div class="avatar" id="home-avatar">?</div>
        <div class="user-info">
            <div class="user-greeting" id="home-greeting">Welcome back,</div>
            <div class="user-name" id="home-name">Student</div>
            <div class="user-class" id="home-class">Loading...</div>
        </div>
        <div class="bell-icon"><i class="fa-regular fa-bell"></i></div>
    </div>

    <div class="search-engine">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" placeholder="Search lessons, subjects..." id="home-search">
        <i class="fa-solid fa-microphone mic-icon"></i>
    </div>

    <div class="progress-module">
        <h3>Continue Learning</h3>
        <div class="progress-card" id="home-continue-card">
            <div class="card-left">
                <div class="badge" id="home-continue-subject">Loading...</div>
                <h4 id="home-continue-title">Fetching your last lesson</h4>
                <div class="progress-info" id="home-continue-info">Please wait...</div>
                <div class="progress-bar"><div class="fill" id="home-continue-bar" style="width: 0%;"></div></div>
            </div>
            <div class="card-right" id="resume-lesson">
                <div class="play-btn"><i class="fa-solid fa-play"></i></div>
                <div class="percent" id="home-continue-pct">0%</div>
            </div>
        </div>
    </div>

    <div class="subject-slider-section">
        <div class="section-header">
            <h3>Your Subjects</h3>
            <a href="#" class="see-all" id="home-see-all">See All</a>
        </div>
        <div class="horizontal-slider" id="home-subjects-slider">
            <div class="subject-card-skeleton"></div>
            <div class="subject-card-skeleton"></div>
            <div class="subject-card-skeleton"></div>
        </div>
    </div>

</div>
