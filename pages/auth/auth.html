<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Adhyayan – Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tillana:wght@500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:16px;-webkit-text-size-adjust:100%;background:#f5f5f3}
*{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{margin:0;background:#f5f5f3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif}
a{cursor:pointer}
.screen.auth-screen{background:#f5f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vh,14px) clamp(12px,3vw,20px);overflow-x:hidden}
.auth-page{width:min(100%,680px);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,0.4vh,5px);padding:0 clamp(12px,2vw,24px)}
.auth-header-container{text-align:center;margin-bottom:clamp(2px,0.3vh,4px);width:100%}
.auth-title{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1vw,6px);margin:0;font-size:clamp(.95rem,2.8vw,1.4rem);line-height:1.05;letter-spacing:-.04em;color:#111;font-weight:800}
.auth-brand-logo{font-family:Tillana,serif;font-weight:500;letter-spacing:0;font-size:clamp(1.8rem,6.5vw,2.8rem);line-height:1;background:linear-gradient(90deg,#0d3d14,#1fa63a);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand-logo-img{display:block;width:clamp(90px,24vw,160px);max-width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(17,17,17,.08))}
.auth-subtitle{margin:clamp(1px,0.2vh,2px) 0 0;font-size:clamp(.68rem,1.8vw,.78rem);color:#666;font-weight:600;font-style:italic}
.auth-form-group{width:100%;margin-bottom:clamp(2px,0.3vh,4px);display:flex;flex-direction:column;gap:clamp(2px,0.35vh,5px);align-items:center}
.input-with-icon{position:relative;width:100%}
.input-with-icon i{position:absolute;left:clamp(12px,2.5vw,18px);top:50%;transform:translateY(-50%);color:#6f6f6f;font-size:clamp(.9rem,1vw,1.1rem);pointer-events:none;display:flex}
.input-with-icon input,.input-with-icon select{width:100%;height:clamp(39px,6vmin,48px);border-radius:clamp(10px,2.8vmin,16px);border:1px solid #cfcfcf;background:rgba(255,255,255,.3);color:#111;font-size:clamp(.88rem,0.93vw,.98rem);font-weight:500;padding:0 clamp(12px,2.5vw,18px) 0 clamp(40px,7vw,50px);outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none;min-height:39px;font-family:inherit}
.input-with-icon select{cursor:pointer;padding-right:42px}
.input-with-icon input::placeholder{color:#6b6b6b}
.input-with-icon input:focus,.input-with-icon select:focus{border-color:#1a8a48;box-shadow:0 0 0 3px rgba(26,138,72,.12)}
.select-wrap{position:relative}
.select-arrow{position:absolute;right:clamp(12px,2.5vw,18px);top:50%;transform:translateY(-50%);color:#444;pointer-events:none;display:flex;font-size:.8rem}
.input-with-icon i.select-arrow{left:auto}
.terms-checkbox-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(5px,0.8vw,8px);width:fit-content;max-width:100%;color:#666;font-size:clamp(.75rem,1.9vw,.83rem);cursor:pointer}
.terms-checkbox-wrap input{width:16px;height:16px;margin:0;accent-color:#1B8039;cursor:pointer;flex:0 0 auto}
.terms-checkbox-wrap a,.footer-links a{color:#1B8039;font-weight:600;text-decoration:none}
.terms-checkbox-wrap a:hover{text-decoration:underline}
.forgot-password-wrap{width:100%;display:flex;justify-content:flex-end;padding-right:4px;margin-bottom:clamp(2px,0.25vh,3px)}
.forgot-link{color:#1b8d47;font-size:.93rem;font-weight:800;text-decoration:none;line-height:1}
.auth-continue{width:100%;height:clamp(40px,6vmin,50px);border:none;border-radius:clamp(12px,3vmin,18px);background:linear-gradient(180deg,#72c76e,#5bb861);color:#fff;font-size:clamp(.88rem,0.95vw,1.05rem);font-weight:800;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);cursor:pointer;transition:transform .15s,filter .2s;min-height:40px;font-family:inherit;margin-bottom:clamp(2px,0.3vh,4px)}
.auth-continue:hover{transform:translateY(-1px);filter:brightness(.98)}
.separator{display:flex;align-items:center;width:100%;margin:clamp(2px,0.3vh,4px) 0 clamp(2px,0.3vh,4px)}
.separator span:first-child,.separator span:last-child{flex:1;height:1px;background:#a0a0a0}
.separator span:nth-child(2){padding:0 clamp(10px,2vw,18px);color:#111;font-size:clamp(.87rem,0.9vw,1rem);font-weight:700}
#btn-google{width:100%;height:clamp(39px,5.8vmin,48px);border-radius:clamp(12px,3vmin,18px);border:1px solid #cfcfcf;background:rgba(255,255,255,.35);color:#4f4f4f;font-size:clamp(.83rem,0.92vw,.93rem);font-weight:600;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.8vw,14px);cursor:pointer;min-height:39px;font-family:inherit;transition:background .2s;margin-bottom:clamp(2px,0.3vh,4px)}
.footer-links{margin-top:clamp(2px,0.3vh,4px);display:flex;align-items:center;justify-content:center;gap:clamp(4px,0.7vw,7px);flex-wrap:wrap;font-size:clamp(.73rem,1.8vw,.83rem);color:#111;font-weight:500}
.class-setter{width:100%;margin-top:clamp(2px,0.3vh,4px);text-align:center}
.class-label{margin:0 0 clamp(3px,0.6vh,6px);font-size:clamp(.78rem,1.9vw,.88rem);color:#111;font-weight:800}
.class-capsules-container{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:6px;scrollbar-width:none;width:100%;gap:clamp(8px,1.5vw,14px);justify-content:center}
.class-capsules-container::-webkit-scrollbar{display:none}
.class-group{min-width:100%;display:flex;justify-content:center;gap:clamp(10px,2vw,16px);scroll-snap-align:start;align-items:center;padding:0 clamp(8px,1.5vw,12px)}
.pill{width:clamp(36px,6vmin,46px);height:clamp(36px,6vmin,46px);flex:0 0 auto;border-radius:50%;border:2px solid #a7a7a7;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(.88rem,0.95vw,1rem);font-weight:700;color:#111;cursor:pointer;transition:all .2s;user-select:none;font-family:inherit}
.pill.active,.pill:hover{background:#1b8d47;border-color:#1b8d47;color:#fff}
.carousel-indicators{display:flex;justify-content:center;gap:clamp(5px,1vw,8px);margin-top:6px}
.carousel-dot{width:clamp(6px,1vw,10px);height:clamp(6px,1vw,10px);border-radius:50%;background:#d0d0d0;transition:background .2s;cursor:pointer;border:none;font-family:inherit}
.carousel-dot.active{background:#2aa35c}
.compliance-text{margin-top:clamp(2px,0.3vh,4px);font-size:clamp(.58rem,1.4vw,.68rem);color:#666;font-weight:600;text-align:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:1.2rem;font-weight:800;color:#111;margin:0}
.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#666;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:#111}
.form-field{margin-bottom:12px}
.form-field label{display:block;font-size:.9rem;font-weight:600;margin-bottom:6px;color:#111}
.form-field input{width:100%;padding:10px 12px;border:1px solid #cfcfcf;border-radius:8px;font-size:.95rem;font-family:inherit;box-sizing:border-box}
.form-field input:focus{outline:none;border-color:#1a8a48;box-shadow:0 0 0 3px rgba(26,138,72,.12)}
.btn-modal{width:100%;padding:12px;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary-modal{background:linear-gradient(180deg,#72c76e,#5bb861);color:#fff}
.btn-primary-modal:hover{filter:brightness(.98)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2aa35c;color:#fff;padding:16px 24px;border-radius:8px;font-size:.9rem;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:90%}
.toast.hidden{display:none}
.google-class-warning{display:none;color:#d9534f;font-size:.85rem;font-weight:600;margin-top:8px;text-align:center}
:focus-visible{outline:3px solid rgba(27,128,57,.4);outline-offset:2px}
@media (max-width:520px){.input-with-icon input,.input-with-icon select{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="screen auth-screen">
  <div class="auth-page">
    <div class="auth-header-container">
      <h2 class="auth-title"><span>Welcome to</span><img src="/Adhyayan-transparent.png" alt="Adhyayan" class="auth-brand-logo-img" onerror="this.outerHTML='<span class=&quot;auth-brand-logo&quot; lang=&quot;hi&quot;>अध्ययन</span>'"></h2>
      <p class="auth-subtitle">Sign in to continue your learning journey</p>
    </div>

    <form id="loginForm" class="auth-form-group">
      <div class="input-with-icon">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" placeholder="Enter your email" id="auth-email">
      </div>
      <div class="input-with-icon">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Enter your password" id="auth-password">
      </div>
      <div class="input-with-icon select-wrap">
        <i class="fa-solid fa-user-tag"></i>
        <select id="auth-role">
          <option value="">Select your role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
        <i class="fa-solid fa-chevron-down select-arrow"></i>
      </div>
      <label class="terms-checkbox-wrap" for="auth-terms">
        <input type="checkbox" id="auth-terms">
        <span>I agree to the <a href="#" id="auth-terms-link">Terms and Conditions</a></span>
      </label>
      <div class="forgot-password-wrap"><a href="#" class="forgot-link" id="btn-forgot-password">Forgot password?</a></div>
      <div class="google-class-warning" id="google-class-warning">Please select your class first</div>
      <button type="submit" class="btn btn-primary auth-continue" id="btn-continue">Continue</button>
    </form>

    <div class="separator"><span></span><span>OR</span><span></span></div>

    <button class="btn btn-social" id="btn-google" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="footer-links">
      <span>New to Adhyayan ?</span>
      <a href="#" id="btn-show-signup">Sign up</a>
      <span class="divider">|</span>
      <a href="#" id="btn-visible-admin-login">Admin Portal</a>
    </div>

    <div class="class-setter">
      <p class="class-label">I'm in class</p>
      <div class="class-capsules-container" id="class-slider">
        <div class="class-group" id="pills"></div>
      </div>
      <div class="carousel-indicators" id="dots"></div>
    </div>

    <div class="compliance-text">By continuing you agree to Terms &amp; Privacy</div>
  </div>
</div>

<!-- SIGNUP MODAL -->
<div id="signup-overlay" class="modal-overlay hidden"></div>
<div id="signup-modal" class="modal hidden" role="dialog">
  <div class="modal-header">
    <h2 class="modal-title">Create Account</h2>
    <button class="modal-close" id="signup-modal-close" type="button">&times;</button>
  </div>
  <div class="form-field">
    <label for="signup-name">Full Name</label>
    <input type="text" id="signup-name" placeholder="Enter your full name">
  </div>
  <div class="form-field">
    <label for="signup-email">Email</label>
    <input type="email" id="signup-email" placeholder="Enter your email">
  </div>
  <div class="form-field">
    <label for="signup-password">Password</label>
    <input type="password" id="signup-password" placeholder="Create a password">
  </div>
  <div class="form-field">
    <label for="signup-role">Role</label>
    <select id="signup-role" style="width:100%;padding:10px 12px;border:1px solid #cfcfcf;border-radius:8px;font-family:inherit;">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="parent">Parent</option>
    </select>
  </div>
  <button class="btn-modal btn-primary-modal" id="btn-submit-signup">Create Account</button>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgot-pwd-overlay" class="modal-overlay hidden"></div>
<div id="forgot-pwd-modal" class="modal hidden" role="dialog">
  <div class="modal-header">
    <h2 class="modal-title">Reset Password</h2>
    <button class="modal-close" id="forgot-modal-close" type="button">&times;</button>
  </div>
  <div id="forgot-view-email">
    <div class="form-field">
      <label for="forgot-email-input">Email Address</label>
      <input type="email" id="forgot-email-input" placeholder="Enter your registered email">
    </div>
    <button class="btn-modal btn-primary-modal" id="btn-forgot-send-otp">Send Recovery Code</button>
  </div>
  <div id="forgot-view-otp" style="display:none;">
    <div class="form-field">
      <label for="forgot-otp-input">Recovery Code</label>
      <input type="text" id="forgot-otp-input" placeholder="Enter the code from your email">
    </div>
    <button class="btn-modal btn-primary-modal" id="btn-forgot-verify-otp">Verify Code</button>
    <button class="btn-modal" id="btn-forgot-resend-otp" style="background:#f0f0f0;color:#111;margin-top:8px;">Resend Code</button>
  </div>
  <div id="forgot-view-reset" style="display:none;">
    <div class="form-field">
      <label for="forgot-new-password">New Password</label>
      <input type="password" id="forgot-new-password" placeholder="Enter your new password">
    </div>
    <button class="btn-modal btn-primary-modal" id="btn-forgot-save-pwd">Update Password</button>
  </div>
</div>

<!-- TOASTS -->
<div id="auth-otp-toast" class="toast hidden">
  <span id="auth-otp-toast-message"></span>
</div>
<div id="signup-success-toast" class="toast hidden">
  <span id="signup-success-toast-message"></span>
</div>

<script>
const slider=document.getElementById('class-slider');
if(slider){
  const dots=[...document.querySelectorAll('.carousel-dot')];
  const pills=document.getElementById('pills');
  const dotsContainer=document.getElementById('dots');
  if(pills&&dotsContainer){
    const cap=[...document.querySelectorAll('.pill')];
    cap.forEach(c=>c.addEventListener('click',()=>{cap.forEach(x=>x.classList.remove('active'));c.classList.add('active')}));
    dots.forEach((d,i)=>d.addEventListener('click',()=>slider.scrollTo({left:i*slider.clientWidth})));
    slider.addEventListener('scroll',()=>{const i=Math.round(slider.scrollLeft/slider.clientWidth);dots.forEach((d,j)=>d.classList.toggle('active',i===j))});
  }
}
document.querySelectorAll('a[href="#"]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
</script>
</body>
</html>
